[project]
name = "labler-vc500w"
version = "0.2.0"
description = "Print labels directly to a Brother VC-500W ZINK color label printer over the LAN (no Brother software)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Wise" }]
keywords = ["brother", "vc-500w", "label", "printer", "zink"]
dependencies = [
    "pillow>=10.0",
    "qrcode>=7.4",
    "rich>=13.0",
    "rich-argparse>=1.4",
]

[project.scripts]
labler = "labler.cli:main"
labler-web = "labler.web.app:main"

[project.optional-dependencies]
web = ["flask>=3.0", "psutil>=5.9"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
