# Config for pokeflute's install-launchd-daemon.sh — a system LaunchDaemon so the
# labeler web service survives headless reboots.
#
# Push to munchlax and run:
#   ssh togepi 'ssh -o BatchMode=yes munchlax "cat > ~/admin/services/labeler.conf"' < deploy/labeler.conf
#   ssh -t munchlax '~/admin/install-launchd-daemon.sh labeler'
#
# USER_NAME=root is REQUIRED, not cosmetic: macOS 26 Local Network Privacy blocks a
# user-level (mike) launchd process from reaching the LAN printer — it fails
# "[Errno 65] No route to host" (a mislabeled permission denial). Root is EXEMPT.
# Proven on munchlax 2026-08-08: a uid=0 daemon connects; the uid=501 one doesn't.
# HOME_ENV keeps the app's runtime data (~/.labeler) in mike's home even though the
# process runs as root, so settings/stats stay put and are writable (root writes
# anywhere). See specs/munchlax-deployment.md and Apple TN3179.
LABEL=com.labeler.web
RUN_SCRIPT=~/projects/labeler-vc500w/deploy/run-labeler-web.sh
WORKING_DIR=~/projects/labeler-vc500w
LOG_FILE=~/.labeler/labeler-web.log
PORT=5001
USER_NAME=root
GROUP_NAME=wheel
HOME_ENV=/Users/mike