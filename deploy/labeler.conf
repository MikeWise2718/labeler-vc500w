# Config for pokeflute's install-launchd-daemon.sh — converts the LaunchAgent into
# a system LaunchDaemon so the labeler web service survives headless reboots.
#
# Push to munchlax and run:
#   ssh togepi 'ssh -o BatchMode=yes munchlax "cat > ~/admin/services/labeler.conf"' < deploy/labeler.conf
#   ssh -t munchlax '~/admin/install-launchd-daemon.sh labeler'
LABEL=com.labeler.web
RUN_SCRIPT=~/projects/labeler-vc500w/deploy/run-labeler-web.sh
WORKING_DIR=~/projects/labeler-vc500w
LOG_FILE=~/.labeler/labeler-web.log
PORT=5001
